<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" width="800" height="370" font-family="Helvetica, Arial, sans-serif">
  <title>Waterfall against short loops: where the team learns</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
  </defs>
  <rect width="800" height="370" fill="#ffffff"/>
  <line x1="410" y1="20" x2="410" y2="350" stroke="#e4e7eb" stroke-width="2"/>

  <!-- Left: waterfall -->
  <text x="205" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2933">Waterfall</text>
  <g font-size="14" fill="#1f2933" text-anchor="middle">
    <rect x="20" y="60" width="115" height="32" rx="6" fill="#dbe7f1" stroke="#2f6f9f"/>
    <text x="77.5" y="81">Requirements</text>
    <rect x="70" y="105" width="115" height="32" rx="6" fill="#dbe7f1" stroke="#2f6f9f"/>
    <text x="127.5" y="126">Design</text>
    <rect x="120" y="150" width="115" height="32" rx="6" fill="#dbe7f1" stroke="#2f6f9f"/>
    <text x="177.5" y="171">Build</text>
    <rect x="170" y="195" width="115" height="32" rx="6" fill="#dbe7f1" stroke="#2f6f9f"/>
    <text x="227.5" y="216">Test</text>
    <rect x="220" y="240" width="115" height="32" rx="6" fill="#dbe7f1" stroke="#2f6f9f"/>
    <text x="277.5" y="261">Release</text>
    <rect x="270" y="285" width="115" height="32" rx="6" fill="#fde2d0" stroke="#c2410c" stroke-width="2"/>
    <text x="327.5" y="306" font-weight="bold" fill="#9a3412">Feedback</text>
  </g>
  <g fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#arrow)">
    <path d="M45,92 V121 H68"/>
    <path d="M95,137 V166 H118"/>
    <path d="M145,182 V211 H168"/>
    <path d="M195,227 V256 H218"/>
    <path d="M245,272 V301 H268"/>
  </g>
  <text x="205" y="345" text-anchor="middle" font-size="14" fill="#9a3412">One feedback point, after everything is built</text>

  <!-- Right: short loops -->
  <text x="610" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2933">Short loops</text>
  <g fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#arrow)">
    <path d="M665,94.7 A110,110 0 0 1 705.3,135"/>
    <path d="M705.3,245 A110,110 0 0 1 665,285.3"/>
    <path d="M555,285.3 A110,110 0 0 1 514.7,245"/>
    <path d="M514.7,135 A110,110 0 0 1 555,94.7"/>
  </g>
  <g font-size="14" fill="#1f2933" text-anchor="middle">
    <rect x="562" y="65" width="96" height="30" rx="6" fill="#dbe7f1" stroke="#2f6f9f"/>
    <text x="610" y="85">Plan</text>
    <rect x="672" y="175" width="96" height="30" rx="6" fill="#dbe7f1" stroke="#2f6f9f"/>
    <text x="720" y="195">Build</text>
    <rect x="562" y="285" width="96" height="30" rx="6" fill="#dbe7f1" stroke="#2f6f9f"/>
    <text x="610" y="305">Release</text>
    <rect x="452" y="175" width="96" height="30" rx="6" fill="#fde2d0" stroke="#c2410c" stroke-width="2"/>
    <text x="500" y="195" font-weight="bold" fill="#9a3412">Feedback</text>
  </g>
  <text x="610" y="186" text-anchor="middle" font-size="13" fill="#52606d">a few weeks</text>
  <text x="610" y="203" text-anchor="middle" font-size="13" fill="#52606d">per turn</text>
  <text x="610" y="345" text-anchor="middle" font-size="14" fill="#9a3412">Feedback on every turn</text>
</svg>
