<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="Helvetica, Arial, sans-serif">
  <!-- Figure: testing the black box. Columns follow the arrange, act, assert pattern. Top row: one run, an Instance
       goes into Optimization through run, and one promise is checked on the Solution. Bottom row: two runs, an
       instance and a transformed copy each go through run, and a relation between the two solutions is checked.
       Optimization is a dark black box with only its public method, run, visible (blue). Data is grey; the test's
       checks are green. -->

  <!-- Light background baked in, so the figure stays readable on a dark theme. -->
  <rect width="980" height="560" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
  </defs>

  <!-- ===== Column headers ===== -->
  <g font-size="17" font-weight="bold" fill="#37474f" text-anchor="middle">
    <text x="150" y="36">Arrange</text>
    <text x="440" y="36">Act</text>
    <text x="800" y="36">Assert</text>
  </g>
  <line x1="20" y1="50" x2="960" y2="50" stroke="#cfd8dc" stroke-width="2"/>

  <!-- ===== Row 1: one run ===== -->
  <text x="20" y="80" font-size="14" font-weight="bold" font-style="italic" fill="#546e7a">One run</text>
  <g font-size="15" text-anchor="middle" fill="#263238">
    <rect x="70" y="110" width="160" height="56" rx="8" fill="#eceff1" stroke="#455a64" stroke-width="1.5"/>
    <text x="150" y="143">Instance</text>
  </g>
  <!-- Black box -->
  <rect x="296" y="96" width="288" height="84" rx="6" fill="#37474f"/>
  <rect x="296" y="96" width="288" height="30" rx="6" fill="#1565c0"/>
  <rect x="296" y="116" width="288" height="10" fill="#1565c0"/>
  <text x="440" y="116" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#ffffff">+ run(instance: Instance) -&gt; Solution</text>
  <text x="440" y="152" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">Optimization</text>
  <text x="440" y="170" text-anchor="middle" font-size="12" font-style="italic" fill="#cfd8dc">black box</text>
  <g font-size="15" text-anchor="middle" fill="#263238">
    <rect x="630" y="110" width="120" height="56" rx="8" fill="#eceff1" stroke="#455a64" stroke-width="1.5"/>
    <text x="690" y="136">Solution</text>
    <text x="690" y="155" font-size="12" fill="#607d8b">or null</text>
  </g>
  <rect x="790" y="104" width="170" height="68" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="875" y="132" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b5e20">check one promise</text>
  <text x="875" y="154" text-anchor="middle" font-size="13" fill="#1b5e20">behaviors 1 to 4</text>
  <g stroke="#37474f" stroke-width="2" marker-end="url(#arrow)">
    <line x1="232" y1="138" x2="292" y2="138"/>
    <line x1="586" y1="138" x2="626" y2="138"/>
    <line x1="752" y1="138" x2="786" y2="138"/>
  </g>

  <line x1="20" y1="215" x2="960" y2="215" stroke="#eceff1" stroke-width="2"/>

  <!-- ===== Row 2: two runs ===== -->
  <text x="20" y="245" font-size="14" font-weight="bold" font-style="italic" fill="#546e7a">Two runs</text>
  <g font-size="15" text-anchor="middle" fill="#263238">
    <rect x="70" y="268" width="160" height="56" rx="8" fill="#eceff1" stroke="#455a64" stroke-width="1.5"/>
    <text x="150" y="301">Instance</text>
    <rect x="70" y="388" width="160" height="56" rx="8" fill="#eceff1" stroke="#455a64" stroke-width="1.5"/>
    <text x="150" y="414">A transformed</text>
    <text x="150" y="432">copy</text>
  </g>
  <line x1="150" y1="326" x2="150" y2="384" stroke="#37474f" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="160" y="360" font-size="12" font-style="italic" fill="#37474f">transform</text>

  <!-- Two black boxes -->
  <g>
    <rect x="330" y="266" width="220" height="60" rx="6" fill="#37474f"/>
    <rect x="330" y="266" width="220" height="24" rx="6" fill="#1565c0"/>
    <rect x="330" y="282" width="220" height="8" fill="#1565c0"/>
    <text x="440" y="283" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" fill="#ffffff">run</text>
    <text x="440" y="314" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Optimization</text>

    <rect x="330" y="386" width="220" height="60" rx="6" fill="#37474f"/>
    <rect x="330" y="386" width="220" height="24" rx="6" fill="#1565c0"/>
    <rect x="330" y="402" width="220" height="8" fill="#1565c0"/>
    <text x="440" y="403" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" fill="#ffffff">run</text>
    <text x="440" y="434" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Optimization</text>
  </g>
  <g font-size="15" text-anchor="middle" fill="#263238">
    <rect x="630" y="268" width="120" height="56" rx="8" fill="#eceff1" stroke="#455a64" stroke-width="1.5"/>
    <text x="690" y="301">Solution′</text>
    <rect x="630" y="388" width="120" height="56" rx="8" fill="#eceff1" stroke="#455a64" stroke-width="1.5"/>
    <text x="690" y="421">Solution″</text>
  </g>
  <rect x="790" y="316" width="170" height="80" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="875" y="342" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b5e20">check a relation</text>
  <text x="875" y="362" text-anchor="middle" font-size="13" fill="#1b5e20">behaviors 5 to 7</text>
  <text x="875" y="383" text-anchor="middle" font-size="13" font-style="italic" fill="#1b5e20">for example z″ ≥ z′</text>
  <g stroke="#37474f" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="232" y1="296" x2="326" y2="296"/>
    <line x1="232" y1="416" x2="326" y2="416"/>
    <line x1="552" y1="296" x2="626" y2="296"/>
    <line x1="552" y1="416" x2="626" y2="416"/>
    <path d="M752,296 L770,296 L770,340 L786,340"/>
    <path d="M752,416 L770,416 L770,372 L786,372"/>
  </g>

  <!-- ===== The test's reach ===== -->
  <line x1="20" y1="480" x2="960" y2="480" stroke="#cfd8dc" stroke-width="2"/>
  <text x="490" y="515" text-anchor="middle" font-size="15" fill="#1b5e20">The test sees only what goes into <tspan font-family="Consolas, Menlo, monospace">run</tspan> and what comes out of it;</text>
  <text x="490" y="538" text-anchor="middle" font-size="15" fill="#1b5e20">everything inside the box stays hidden.</text>
</svg>
