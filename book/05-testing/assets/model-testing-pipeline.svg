<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 720" width="480" height="720" font-family="Helvetica, Arial, sans-serif">
  <!-- Figure: the optimization phase. A simplified UML box for the class Optimization, drawn vertically. Its only
       public method, run, is the contract (blue). Below it, the five private steps of the optimization phase run top
       to bottom (orange, implementation details). An Instance enters at the top and a Solution leaves at the
       bottom. -->

  <!-- Light background baked in, so the figure stays readable on a dark theme. -->
  <rect width="480" height="720" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
  </defs>

  <!-- ===== Instance in ===== -->
  <rect x="140" y="20" width="200" height="50" rx="8" fill="#eceff1" stroke="#455a64" stroke-width="1.5"/>
  <text x="240" y="51" text-anchor="middle" font-size="16" fill="#263238">Instance</text>
  <line x1="240" y1="72" x2="240" y2="106" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Class Optimization ===== -->
  <rect x="40" y="110" width="400" height="530" rx="4" fill="#ffffff" stroke="#37474f" stroke-width="2"/>
  <!-- Name compartment -->
  <text x="240" y="138" text-anchor="middle" font-size="18" font-weight="bold" fill="#263238">Optimization</text>
  <text x="240" y="158" text-anchor="middle" font-size="13" font-style="italic" fill="#546e7a">the optimization phase</text>
  <line x1="40" y1="172" x2="440" y2="172" stroke="#37474f" stroke-width="2"/>
  <!-- Public compartment: the contract -->
  <rect x="41" y="173" width="398" height="56" fill="#e3f2fd"/>
  <text x="240" y="206" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="14" fill="#0d47a1">+ run(instance: Instance) -&gt; Solution</text>
  <line x1="40" y1="230" x2="440" y2="230" stroke="#37474f" stroke-width="2"/>
  <!-- Private compartment: the five steps -->
  <text x="240" y="254" text-anchor="middle" font-size="13" font-style="italic" fill="#bf360c">private: implementation details</text>
  <g font-size="14" fill="#bf360c" text-anchor="middle">
    <rect x="100" y="268" width="280" height="44" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
    <text x="240" y="295">- receive the instance</text>
    <rect x="100" y="340" width="280" height="44" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
    <text x="240" y="367">- build the model</text>
    <rect x="100" y="412" width="280" height="44" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
    <text x="240" y="439">- solve</text>
    <rect x="100" y="484" width="280" height="44" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
    <text x="240" y="511">- assemble the solution</text>
    <rect x="100" y="556" width="280" height="44" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
    <text x="240" y="583">- return the solution</text>
  </g>
  <g stroke="#37474f" stroke-width="2" marker-end="url(#arrow)">
    <line x1="240" y1="313" x2="240" y2="336"/>
    <line x1="240" y1="385" x2="240" y2="408"/>
    <line x1="240" y1="457" x2="240" y2="480"/>
    <line x1="240" y1="529" x2="240" y2="552"/>
  </g>

  <!-- ===== Solution out ===== -->
  <line x1="240" y1="642" x2="240" y2="656" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="140" y="660" width="200" height="50" rx="8" fill="#eceff1" stroke="#455a64" stroke-width="1.5"/>
  <text x="240" y="691" text-anchor="middle" font-size="16" fill="#263238">Solution</text>
</svg>
