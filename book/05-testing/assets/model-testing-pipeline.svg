<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" width="940" height="330" font-family="Helvetica, Arial, sans-serif">
  <!-- Figure: the pipeline under test. Five modules (orange, implementation) run in sequence inside a dashed
       boundary: the integration test. The instance enters and the result leaves through the contract (blue). The test
       (green, a client) hands in the instance and reads only the result. -->

  <!-- Light background baked in, so the figure stays readable on a dark theme. -->
  <rect width="940" height="330" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
  </defs>

  <!-- ===== Integration test boundary ===== -->
  <rect x="110" y="30" width="720" height="150" rx="12" fill="#fafafa" stroke="#78909c" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="470" y="54" text-anchor="middle" font-size="14" font-style="italic" fill="#546e7a">integration test: the five modules run together</text>

  <!-- ===== Contract edges ===== -->
  <rect x="104" y="72" width="12" height="90" rx="3" fill="#1565c0"/>
  <rect x="824" y="72" width="12" height="90" rx="3" fill="#1565c0"/>
  <text x="110" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">contract</text>
  <text x="830" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">contract</text>

  <!-- ===== The five modules ===== -->
  <g font-size="14" fill="#bf360c" text-anchor="middle">
    <rect x="130" y="80" width="118" height="74" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
    <text x="189" y="112">Receive</text>
    <text x="189" y="130">the instance</text>

    <rect x="270" y="80" width="118" height="74" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
    <text x="329" y="112">Build</text>
    <text x="329" y="130">the model</text>

    <rect x="410" y="80" width="118" height="74" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
    <text x="469" y="121">Solve</text>

    <rect x="550" y="80" width="118" height="74" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
    <text x="609" y="112">Assemble</text>
    <text x="609" y="130">the solution</text>

    <rect x="690" y="80" width="118" height="74" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
    <text x="749" y="112">Return</text>
    <text x="749" y="130">the result</text>
  </g>
  <g fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)">
    <line x1="249" y1="117" x2="267" y2="117"/>
    <line x1="389" y1="117" x2="407" y2="117"/>
    <line x1="529" y1="117" x2="547" y2="117"/>
    <line x1="669" y1="117" x2="687" y2="117"/>
  </g>

  <!-- ===== Instance in, result out ===== -->
  <g font-size="14" fill="#263238" text-anchor="middle">
    <rect x="12" y="92" width="80" height="50" rx="8" fill="#eceff1" stroke="#455a64" stroke-width="1.5"/>
    <text x="52" y="122">Instance</text>
    <rect x="848" y="92" width="80" height="50" rx="8" fill="#eceff1" stroke="#455a64" stroke-width="1.5"/>
    <text x="888" y="122">Result</text>
  </g>
  <g fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)">
    <line x1="93" y1="117" x2="101" y2="117"/>
    <line x1="838" y1="117" x2="845" y2="117"/>
  </g>

  <!-- ===== The test ===== -->
  <rect x="370" y="250" width="200" height="56" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="470" y="276" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b5e20">Test</text>
  <text x="470" y="296" text-anchor="middle" font-size="13" fill="#1b5e20">sees only the contract</text>
  <g fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow)">
    <path d="M370,278 L52,278 L52,146"/>
    <path d="M888,146 L888,278 L574,278"/>
  </g>
  <text x="200" y="270" text-anchor="middle" font-size="13" fill="#1b5e20">hands in an instance</text>
  <text x="740" y="270" text-anchor="middle" font-size="13" fill="#1b5e20">checks the result</text>
</svg>
