<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="500" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
  </defs>

  <!-- end-to-end -->
  <polygon points="400,40 480,170 320,170" fill="#90caf9" stroke="#1565c0" stroke-width="2"/>
  <text x="400" y="140" text-anchor="middle" font-size="17" font-weight="bold" fill="#0d47a1">End-to-end</text>
  <text x="500" y="110" font-size="15" fill="#0d47a1">The whole application,</text>
  <text x="500" y="130" font-size="15" fill="#0d47a1">in a real-world scenario</text>

  <!-- integration -->
  <polygon points="310,185 490,185 565,305 235,305" fill="#fff59d" stroke="#f9a825" stroke-width="2"/>
  <text x="400" y="252" text-anchor="middle" font-size="17" font-weight="bold" fill="#6d4c00">Integration</text>
  <text x="585" y="240" font-size="15" fill="#6d4c00">Units combined and</text>
  <text x="585" y="260" font-size="15" fill="#6d4c00">tested as a group</text>

  <!-- unit -->
  <polygon points="226,320 574,320 650,440 150,440" fill="#a5d6a7" stroke="#2e7d32" stroke-width="2"/>
  <text x="400" y="387" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b5e20">Unit</text>
  <text x="665" y="375" font-size="15" fill="#1b5e20">One small piece,</text>
  <text x="665" y="395" font-size="15" fill="#1b5e20">in isolation</text>

  <!-- axes -->
  <line x1="60" y1="440" x2="60" y2="50" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="45" y="245" text-anchor="middle" font-size="15" fill="#37474f" transform="rotate(-90 45 245)">Cost per test</text>
  <line x1="100" y1="50" x2="100" y2="440" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="125" y="245" text-anchor="middle" font-size="15" fill="#37474f" transform="rotate(-90 125 245)">Speed</text>
  <line x1="150" y1="470" x2="650" y2="470" stroke="#37474f" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="400" y="492" text-anchor="middle" font-size="15" fill="#37474f">Number of tests</text>
</svg>
