<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" font-family="Helvetica, Arial, sans-serif">
  <!-- Figure: real and mocked dependencies. NightlyPlanner in the middle of an integration test. The results
       file (green) is a managed dependency, used only by this program, so the test keeps it real. The notifier
       (purple) is an unmanaged dependency, observed by people, so the test replaces it with a mock. -->

  <!-- Light background baked in, so the figure stays readable on a dark theme. -->
  <rect width="860" height="300" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
  </defs>

  <!-- ===== The unit under test ===== -->
  <rect x="330" y="110" width="200" height="70" rx="10" fill="#eceff1" stroke="#455a64" stroke-width="2"/>
  <text x="430" y="151" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" fill="#263238">NightlyPlanner</text>

  <!-- ===== Managed dependency: the results file, kept real ===== -->
  <g id="managed">
    <rect x="30" y="60" width="230" height="170" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <!-- A file icon: a page with a folded corner. -->
    <path d="M125,80 L155,80 L167,92 L167,125 L125,125 Z" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
    <path d="M155,80 L155,92 L167,92" fill="none" stroke="#2e7d32" stroke-width="2"/>
    <text x="145" y="150" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b5e20">Results file</text>
    <text x="145" y="175" text-anchor="middle" font-size="13" fill="#1b5e20">Managed: only this program</text>
    <text x="145" y="192" text-anchor="middle" font-size="13" fill="#1b5e20">uses it</text>
    <text x="145" y="217" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">Real in the test</text>
  </g>

  <!-- ===== Unmanaged dependency: the notifier, replaced by a mock ===== -->
  <g id="unmanaged">
    <rect x="600" y="60" width="230" height="170" rx="10" fill="#ede7f6" stroke="#5e35b1" stroke-width="2" stroke-dasharray="7 4"/>
    <!-- A bell icon. -->
    <path d="M700,122 L700,104 C700,92 708,84 715,84 C722,84 730,92 730,104 L730,122 L736,128 L694,128 Z" fill="#ffffff" stroke="#5e35b1" stroke-width="2"/>
    <circle cx="715" cy="132" r="4" fill="#5e35b1"/>
    <text x="715" y="155" text-anchor="middle" font-size="17" font-weight="bold" fill="#4527a0">Notifier</text>
    <text x="715" y="178" text-anchor="middle" font-size="13" fill="#4527a0">Unmanaged: people</text>
    <text x="715" y="195" text-anchor="middle" font-size="13" fill="#4527a0">observe it</text>
    <text x="715" y="219" text-anchor="middle" font-size="14" font-weight="bold" fill="#4527a0">Mock in the test</text>
  </g>

  <!-- ===== Calls from the planner to each dependency ===== -->
  <g fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)">
    <line x1="328" y1="145" x2="264" y2="145"/>
    <line x1="532" y1="145" x2="596" y2="145"/>
  </g>
  <text x="296" y="136" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="#37474f">read</text>
  <text x="564" y="136" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="#37474f">notify</text>

  <!-- ===== Caption ===== -->
  <text x="430" y="275" text-anchor="middle" font-size="15" fill="#37474f">Keep what only your program uses real; mock what others observe</text>
</svg>
