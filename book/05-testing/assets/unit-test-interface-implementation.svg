<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Helvetica, Arial, sans-serif">
  <!-- Figure: add interface and implementation. The calculator's add, written as pseudocode, split into
       its two parts: the interface (blue, top) and the implementation (orange, bottom). The hues match
       unit-test-socket.svg, where the same two parts appear as a wall socket and the wiring behind it. -->

  <!-- Light background baked in, so the figure stays readable on a dark theme. -->
  <rect width="960" height="420" fill="#ffffff"/>

  <!-- ===== Interface: the signature and the comments that state its promises ===== -->
  <g id="interface">
    <!-- Band behind the interface lines. -->
    <rect x="20" y="40" width="600" height="144" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <!-- Code, one line every 22 px; each indent level shifts x by 29 px (four monospace characters). -->
    <g font-family="Consolas, Menlo, monospace" font-size="13">
      <text x="36" y="64" fill="#0d47a1" font-weight="bold">public add(a, b) returns number</text>
      <text x="65" y="86" fill="#1565c0">// Returns the sum a + b.</text>
      <text x="65" y="108" fill="#1565c0">// Commutativity: add(a, b) = add(b, a)</text>
      <text x="65" y="130" fill="#1565c0">// Identity: add(a, 0) = a</text>
      <text x="65" y="152" fill="#1565c0">// Fails with an invalid-input error if a or b is not a finite number</text>
      <text x="65" y="174" fill="#1565c0">// Fails with an overflow error if the sum is too large to represent</text>
    </g>
    <!-- Bracket and labels on the right: what the interface is. -->
    <path d="M632,46 L644,46 L644,178 L632,178" fill="none" stroke="#1565c0" stroke-width="2"/>
    <text x="660" y="80" font-size="18" font-weight="bold" fill="#0d47a1">Interface</text>
    <text x="660" y="104" font-size="14" fill="#0d47a1">What the unit does</text>
    <text x="660" y="124" font-size="14" fill="#0d47a1">Also called signature, API or contract</text>
    <text x="660" y="144" font-size="14" fill="#0d47a1">Its comments are part of it</text>
    <text x="660" y="164" font-size="14" fill="#0d47a1">Visible to every client</text>
  </g>

  <!-- ===== Implementation: the body that keeps the promises ===== -->
  <g id="implementation">
    <!-- Band behind the implementation lines. -->
    <rect x="20" y="194" width="600" height="206" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
    <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#bf360c">
      <text x="65" y="218">if a is not a finite number</text>
      <text x="94" y="240">fail with invalid-input error</text>
      <text x="65" y="262">if b is not a finite number</text>
      <text x="94" y="284">fail with invalid-input error</text>
      <text x="65" y="306">result = a + b</text>
      <text x="65" y="328">if result is too large to represent</text>
      <text x="94" y="350">fail with overflow error</text>
      <text x="65" y="372">return result</text>
    </g>
    <!-- Bracket and labels on the right: what the implementation is. -->
    <path d="M632,200 L644,200 L644,394 L632,394" fill="none" stroke="#e65100" stroke-width="2"/>
    <text x="660" y="268" font-size="18" font-weight="bold" fill="#bf360c">Implementation</text>
    <text x="660" y="292" font-size="14" fill="#bf360c">How the unit does it</text>
    <text x="660" y="312" font-size="14" fill="#bf360c">Hidden from clients</text>
    <text x="660" y="332" font-size="14" fill="#bf360c">One of many possible behind the interface</text>
  </g>
</svg>
