<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" width="860" height="320" font-family="Helvetica, Arial, sans-serif">
  <title>Figure: iterated solve</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker>
  </defs>
  <rect width="860" height="320" fill="#ffffff"/>
  <rect x="165" y="50" width="545" height="195" rx="10" fill="none" stroke="#52606d" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="179" y="42" text-anchor="start" font-size="12" fill="#52606d" font-weight="normal" font-style="italic" xml:space="preserve">what the caller sees: one solve(instance) returns Result</text>
  <rect x="25" y="100" width="110" height="34" rx="17" fill="#d9f0e1" stroke="#2f855a" stroke-width="1.5"/>
  <text x="80.0" y="121.68" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="normal" xml:space="preserve">Instance</text>
  <rect x="200" y="89" width="180" height="56" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="290.0" y="114.0" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="bold" xml:space="preserve">provider</text>
  <text x="290.0" y="131.0" text-anchor="middle" font-size="12" fill="#52606d" font-weight="normal" xml:space="preserve">exact or heuristic</text>
  <rect x="480" y="89" width="200" height="56" rx="6" fill="#fdf3c4" stroke="#b7791f" stroke-width="1.5"/>
  <text x="580.0" y="114.0" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="bold" xml:space="preserve">evaluator</text>
  <text x="580.0" y="131.0" text-anchor="middle" font-size="12" fill="#52606d" font-weight="normal" xml:space="preserve">model, simulation or rules</text>
  <line x1="137" y1="117" x2="198" y2="117" stroke="#52606d" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="382" y1="117" x2="478" y2="117" stroke="#52606d" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="430" y="109" text-anchor="middle" font-size="12" fill="#52606d" font-weight="normal" xml:space="preserve">answer</text>
  <path d="M580,147 V190 H290 V147" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="435" y="182" text-anchor="middle" font-size="12" fill="#52606d" font-weight="normal" xml:space="preserve">feedback for the next round</text>
  <rect x="740" y="100" width="100" height="34" rx="17" fill="#d9f0e1" stroke="#2f855a" stroke-width="1.5"/>
  <text x="790.0" y="121.68" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="normal" xml:space="preserve">Result</text>
  <line x1="682" y1="117" x2="738" y2="117" stroke="#52606d" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="437" y="226" text-anchor="middle" font-size="12" fill="#52606d" font-weight="normal" font-style="italic" xml:space="preserve">keeps the best acceptable answer; stops on a proof, on no more feedback, or at a round limit</text>
  <rect x="30" y="285" width="16" height="14" rx="3" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
  <text x="52" y="296" text-anchor="start" font-size="12" fill="#52606d" font-weight="normal" xml:space="preserve">provider of either kind</text>
  <rect x="210" y="285" width="16" height="14" rx="3" fill="#fdf3c4" stroke="#b7791f" stroke-width="1.2"/>
  <text x="232" y="296" text-anchor="start" font-size="12" fill="#52606d" font-weight="normal" xml:space="preserve">evaluator</text>
  <rect x="320" y="285" width="16" height="14" rx="7" fill="#d9f0e1" stroke="#2f855a" stroke-width="1.2"/>
  <text x="342" y="296" text-anchor="start" font-size="12" fill="#52606d" font-weight="normal" xml:space="preserve">record</text>
</svg>
