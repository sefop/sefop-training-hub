<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="820" height="480" font-family="Helvetica, Arial, sans-serif">
  <title>Figure: clean architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker>
    <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#52606d" stroke-width="1.4"/></marker>
    <marker id="hollow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#52606d" stroke-width="1.2"/></marker>
  </defs>
  <rect width="820" height="480" fill="#ffffff"/>
  <circle cx="260" cy="240" r="220" fill="#d6e6f5" stroke="#2f6f9f" stroke-width="2"/>
  <circle cx="260" cy="240" r="165" fill="#d9f0e1" stroke="#2f855a" stroke-width="2"/>
  <circle cx="260" cy="240" r="110" fill="#fcefc7" stroke="#b7791f" stroke-width="2"/>
  <circle cx="260" cy="240" r="55" fill="#e6defa" stroke="#6b46c1" stroke-width="2"/>
  <text x="260" y="46" text-anchor="middle" font-size="14" fill="#2f6f9f" font-weight="bold" xml:space="preserve">Frameworks and drivers</text>
  <text x="260" y="101" text-anchor="middle" font-size="14" fill="#2f855a" font-weight="bold" xml:space="preserve">Interface adapters</text>
  <text x="260" y="156" text-anchor="middle" font-size="14" fill="#b7791f" font-weight="bold" xml:space="preserve">Use cases</text>
  <text x="260" y="245" text-anchor="middle" font-size="14" fill="#6b46c1" font-weight="bold" xml:space="preserve">Entities</text>
  <line x1="466" y1="240" x2="430" y2="240" stroke="#c2410c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="411" y1="240" x2="375" y2="240" stroke="#c2410c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="356" y1="240" x2="320" y2="240" stroke="#c2410c" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="520" y="74" width="16" height="16" rx="3" fill="#e6defa" stroke="#6b46c1" stroke-width="2"/>
  <text x="546" y="87" text-anchor="start" font-size="14" fill="#1f2933" font-weight="bold" xml:space="preserve">Entities</text>
  <text x="546" y="106" text-anchor="start" font-size="12" fill="#52606d" font-weight="normal" xml:space="preserve">business objects and their rules</text>
  <rect x="520" y="144" width="16" height="16" rx="3" fill="#fcefc7" stroke="#b7791f" stroke-width="2"/>
  <text x="546" y="157" text-anchor="start" font-size="14" fill="#1f2933" font-weight="bold" xml:space="preserve">Use cases</text>
  <text x="546" y="176" text-anchor="start" font-size="12" fill="#52606d" font-weight="normal" xml:space="preserve">what this application does with the entities</text>
  <rect x="520" y="214" width="16" height="16" rx="3" fill="#d9f0e1" stroke="#2f855a" stroke-width="2"/>
  <text x="546" y="227" text-anchor="start" font-size="14" fill="#1f2933" font-weight="bold" xml:space="preserve">Interface adapters</text>
  <text x="546" y="246" text-anchor="start" font-size="12" fill="#52606d" font-weight="normal" xml:space="preserve">translate between use cases and the outside world</text>
  <rect x="520" y="284" width="16" height="16" rx="3" fill="#d6e6f5" stroke="#2f6f9f" stroke-width="2"/>
  <text x="546" y="297" text-anchor="start" font-size="14" fill="#1f2933" font-weight="bold" xml:space="preserve">Frameworks and drivers</text>
  <text x="546" y="316" text-anchor="start" font-size="12" fill="#52606d" font-weight="normal" xml:space="preserve">the tools: web framework, database, files</text>
  <line x1="524" y1="400" x2="560" y2="400" stroke="#c2410c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="570" y="404" text-anchor="start" font-size="13" fill="#9a3412" font-weight="bold" xml:space="preserve">source dependencies point inward</text>
</svg>
