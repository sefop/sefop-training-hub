  <text x="50" y="116" text-anchor="start" font-size="12" fill="#1f2933" font-weight="normal" font-family="Consolas, Menlo, monospace" xml:space="preserve">- choose(instance): SolutionProvider</text>
  <rect x="470" y="50" width="350" height="72" rx="4" fill="#ffffff" stroke="#2f6f9f" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="645.0" y="67" text-anchor="middle" font-size="12" fill="#52606d" font-weight="normal" xml:space="preserve">«interface»</text>
  <text x="645.0" y="85" text-anchor="middle" font-size="14" fill="#1f2933" font-weight="bold" xml:space="preserve">SolutionProvider</text>
  <line x1="470" y1="94" x2="820" y2="94" stroke="#2f6f9f" stroke-width="1"/>
  <text x="480" y="114" text-anchor="start" font-size="12" fill="#1f2933" font-weight="normal" font-family="Consolas, Menlo, monospace" xml:space="preserve">+ solve(instance): Result</text>
