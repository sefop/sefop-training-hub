  <text x="435" y="82" text-anchor="middle" font-size="12" fill="#52606d" font-weight="normal" xml:space="preserve">uses</text>
  <rect x="150" y="220" width="260" height="58" rx="4" fill="#ffffff" stroke="#2f6f9f" stroke-width="1.5"/>
  <text x="280.0" y="240" text-anchor="middle" font-size="14" fill="#1f2933" font-weight="bold" xml:space="preserve">MipProviderGurobi</text>
  <line x1="150" y1="250" x2="410" y2="250" stroke="#2f6f9f" stroke-width="1"/>
  <text x="160" y="270" text-anchor="start" font-size="12" fill="#1f2933" font-weight="normal" font-family="Consolas, Menlo, monospace" xml:space="preserve">+ solve(instance): Result</text>
  <line x1="280" y1="220" x2="600" y2="124" stroke="#52606d" stroke-width="1.6" marker-end="url(#hollow)"/>
  <text x="280" y="300" text-anchor="middle" font-size="12" fill="#52606d" font-weight="normal" font-style="italic" xml:space="preserve">chosen when it can finish in time</text>
  <rect x="460" y="220" width="260" height="58" rx="4" fill="#ffffff" stroke="#2f6f9f" stroke-width="1.5"/>
  <text x="590.0" y="240" text-anchor="middle" font-size="14" fill="#1f2933" font-weight="bold" xml:space="preserve">GreedyHeuristicProvider</text>
