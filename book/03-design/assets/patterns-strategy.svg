  <line x1="40" y1="60" x2="400" y2="60" stroke="#2f6f9f" stroke-width="1"/>
  <text x="50" y="80" text-anchor="start" font-size="12" fill="#1f2933" font-weight="normal" font-family="Consolas, Menlo, monospace" xml:space="preserve">- providers</text>
