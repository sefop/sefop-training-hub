  <path d="M720,284 H730 V76" fill="none" stroke="#c2410c" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arrow-o)"/>
  <text x="724" y="165" text-anchor="end" font-size="11" fill="#9a3412" font-weight="normal" xml:space="preserve">the one exception to the dependency rule</text>
  <text x="100" y="347" text-anchor="start" font-size="12" fill="#52606d" font-weight="normal" xml:space="preserve">PlanFlightLoad receives business records and returns a LoadPlan or a NoPlan.</text>
