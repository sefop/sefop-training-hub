<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 382" width="900" height="382" font-family="Helvetica, Arial, sans-serif">
  <title>Figure: reasons to change</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker>
    <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#52606d" stroke-width="1.4"/></marker>
    <marker id="hollow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#52606d" stroke-width="1.2"/></marker>
  </defs>
  <rect width="900" height="382" fill="#ffffff"/>
  <text x="20" y="30" text-anchor="start" font-size="13" fill="#52606d" font-weight="bold" xml:space="preserve">Listing: tangled script</text>
  <text x="34" y="60" text-anchor="start" font-size="12" fill="#52606d" font-weight="normal" font-family="Consolas, Menlo, monospace" xml:space="preserve">// listing: tangled-script</text>
  <text x="34" y="84" text-anchor="start" font-size="12" fill="#1f2933" font-weight="normal" font-family="Consolas, Menlo, monospace" xml:space="preserve">public function plan_flight_load(booking_file, aircraft_file, plan_file):</text>
  <rect x="20" y="93" width="590" height="24" fill="#dbe7f1"/>
  <rect x="20" y="93" width="5" height="24" fill="#2f6f9f"/>
  <text x="34" y="108" text-anchor="start" font-size="12" fill="#1f2933" font-weight="normal" font-family="Consolas, Menlo, monospace" xml:space="preserve">    products = read each row of booking_file as a product</text>
  <rect x="20" y="117" width="590" height="24" fill="#dbe7f1"/>
  <rect x="20" y="117" width="5" height="24" fill="#2f6f9f"/>
  <text x="34" y="132" text-anchor="start" font-size="12" fill="#1f2933" font-weight="normal" font-family="Consolas, Menlo, monospace" xml:space="preserve">    capacity = read weight and volume limits from aircraft_file</text>
  <rect x="20" y="141" width="590" height="24" fill="#fde2d0"/>
  <rect x="20" y="141" width="5" height="24" fill="#c2410c"/>
  <text x="34" y="156" text-anchor="start" font-size="12" fill="#1f2933" font-weight="normal" font-family="Consolas, Menlo, monospace" xml:space="preserve">    if committed freight exceeds capacity:</text>
  <rect x="20" y="165" width="590" height="24" fill="#e4e7eb"/>
  <rect x="20" y="165" width="5" height="24" fill="#52606d"/>
  <text x="34" y="180" text-anchor="start" font-size="12" fill="#1f2933" font-weight="normal" font-family="Consolas, Menlo, monospace" xml:space="preserve">        write &quot;INFEASIBLE&quot; to plan_file</text>
  <rect x="20" y="189" width="590" height="24" fill="#fde2d0"/>
  <rect x="20" y="189" width="5" height="24" fill="#c2410c"/>
  <text x="34" y="204" text-anchor="start" font-size="12" fill="#1f2933" font-weight="normal" font-family="Consolas, Menlo, monospace" xml:space="preserve">        stop</text>
  <rect x="20" y="213" width="590" height="24" fill="#fcefc7"/>
  <rect x="20" y="213" width="5" height="24" fill="#b7791f"/>
  <text x="34" y="228" text-anchor="start" font-size="12" fill="#1f2933" font-weight="normal" font-family="Consolas, Menlo, monospace" xml:space="preserve">    remove products whose single pallet cannot fit in the aircraft</text>
  <rect x="20" y="237" width="590" height="24" fill="#e6defa"/>
  <rect x="20" y="237" width="5" height="24" fill="#6b46c1"/>
  <text x="34" y="252" text-anchor="start" font-size="12" fill="#1f2933" font-weight="normal" font-family="Consolas, Menlo, monospace" xml:space="preserve">    model = create a model with the solver library</text>
  <rect x="20" y="261" width="590" height="24" fill="#d9f0e1"/>
  <rect x="20" y="261" width="5" height="24" fill="#2f855a"/>
  <text x="34" y="276" text-anchor="start" font-size="12" fill="#1f2933" font-weight="normal" font-family="Consolas, Menlo, monospace" xml:space="preserve">    add variables, constraints and objective to model</text>
  <rect x="20" y="285" width="590" height="24" fill="#e6defa"/>
  <rect x="20" y="285" width="5" height="24" fill="#6b46c1"/>
  <text x="34" y="300" text-anchor="start" font-size="12" fill="#1f2933" font-weight="normal" font-family="Consolas, Menlo, monospace" xml:space="preserve">    solve model with a 60-second time limit</text>
  <rect x="20" y="309" width="590" height="24" fill="#e6defa"/>
  <rect x="20" y="309" width="5" height="24" fill="#6b46c1"/>
  <text x="34" y="324" text-anchor="start" font-size="12" fill="#1f2933" font-weight="normal" font-family="Consolas, Menlo, monospace" xml:space="preserve">    pallets = for each product, ask model for the value of its variable</text>
  <rect x="20" y="333" width="590" height="24" fill="#e4e7eb"/>
  <rect x="20" y="333" width="5" height="24" fill="#52606d"/>
  <text x="34" y="348" text-anchor="start" font-size="12" fill="#1f2933" font-weight="normal" font-family="Consolas, Menlo, monospace" xml:space="preserve">    write pallets and revenue as CSV to plan_file</text>
  <text x="650" y="60" text-anchor="start" font-size="15" fill="#1f2933" font-weight="bold" xml:space="preserve">Reason to change</text>
  <rect x="650" y="78" width="22" height="20" rx="3" fill="#dbe7f1" stroke="#2f6f9f" stroke-width="2"/>
  <text x="682" y="93" text-anchor="start" font-size="14" fill="#1f2933" font-weight="normal" xml:space="preserve">Input format</text>
  <rect x="650" y="110" width="22" height="20" rx="3" fill="#fde2d0" stroke="#c2410c" stroke-width="2"/>
  <text x="682" y="125" text-anchor="start" font-size="14" fill="#1f2933" font-weight="normal" xml:space="preserve">Business rules</text>
  <rect x="650" y="142" width="22" height="20" rx="3" fill="#fcefc7" stroke="#b7791f" stroke-width="2"/>
  <text x="682" y="157" text-anchor="start" font-size="14" fill="#1f2933" font-weight="normal" xml:space="preserve">Preprocessing</text>
  <rect x="650" y="174" width="22" height="20" rx="3" fill="#d9f0e1" stroke="#2f855a" stroke-width="2"/>
  <text x="682" y="189" text-anchor="start" font-size="14" fill="#1f2933" font-weight="normal" xml:space="preserve">Formulation</text>
  <rect x="650" y="206" width="22" height="20" rx="3" fill="#e6defa" stroke="#6b46c1" stroke-width="2"/>
  <text x="682" y="221" text-anchor="start" font-size="14" fill="#1f2933" font-weight="normal" xml:space="preserve">Solver library</text>
  <rect x="650" y="238" width="22" height="20" rx="3" fill="#e4e7eb" stroke="#52606d" stroke-width="2"/>
  <text x="682" y="253" text-anchor="start" font-size="14" fill="#1f2933" font-weight="normal" xml:space="preserve">Output format</text>
</svg>
