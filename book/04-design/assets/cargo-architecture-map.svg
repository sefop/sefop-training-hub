  <text x="165.0" y="254.6" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="normal" xml:space="preserve">preprocess</text>
  <rect x="227" y="234" width="106" height="32" rx="6" fill="#fcefc7" stroke="#b7791f" stroke-width="1.5"/>
  <text x="280.0" y="254.6" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="normal" xml:space="preserve">optimize</text>
  <line x1="218" y1="250" x2="226" y2="250" stroke="#52606d" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="342" y="234" width="106" height="32" rx="6" fill="#fcefc7" stroke="#b7791f" stroke-width="1.5"/>
  <text x="395.0" y="254.6" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="normal" xml:space="preserve">postprocess</text>
  <line x1="333" y1="250" x2="341" y2="250" stroke="#52606d" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="490" y="195" width="230" height="30" rx="6" fill="#ffffff" stroke="#b7791f" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="605.0" y="214.6" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="bold" xml:space="preserve">«interface» SolutionProvider</text>
  <rect x="510" y="235" width="210" height="26" rx="6" fill="#ffffff" stroke="#b7791f" stroke-width="1.5"/>
  <text x="615.0" y="252.2" text-anchor="middle" font-size="12" fill="#1f2933" font-weight="normal" xml:space="preserve">EnumerationProvider</text>
  <rect x="510" y="267" width="210" height="26" rx="6" fill="#ffffff" stroke="#b7791f" stroke-width="1.5"/>
  <text x="615.0" y="284.2" text-anchor="middle" font-size="12" fill="#1f2933" font-weight="normal" xml:space="preserve">GreedyHeuristicProvider</text>
  <rect x="510" y="299" width="210" height="26" rx="6" fill="#ffffff" stroke="#b7791f" stroke-width="1.5"/>
  <text x="615.0" y="316.2" text-anchor="middle" font-size="12" fill="#1f2933" font-weight="normal" xml:space="preserve">MipProviderGurobi</text>
  <line x1="300" y1="234" x2="486" y2="212" stroke="#52606d" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="100" y="305" text-anchor="start" font-size="13" fill="#52606d" font-weight="normal" xml:space="preserve">PlanFlightLoad receives entities and returns a LoadPlan.</text>
  <text x="100" y="325" text-anchor="start" font-size="13" fill="#52606d" font-weight="normal" xml:space="preserve">Every read and write happens in the adapters.</text>
  <rect x="135" y="380" width="125" height="32" rx="6" fill="#ffffff" stroke="#6b46c1" stroke-width="1.5"/>
  <text x="197.5" y="400.6" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="normal" xml:space="preserve">Product</text>
  <rect x="275" y="380" width="125" height="32" rx="6" fill="#ffffff" stroke="#6b46c1" stroke-width="1.5"/>
  <text x="337.5" y="400.6" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="normal" xml:space="preserve">BookingList</text>
  <rect x="415" y="380" width="125" height="32" rx="6" fill="#ffffff" stroke="#6b46c1" stroke-width="1.5"/>
  <text x="477.5" y="400.6" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="normal" xml:space="preserve">Aircraft</text>
  <rect x="555" y="380" width="125" height="32" rx="6" fill="#ffffff" stroke="#6b46c1" stroke-width="1.5"/>
  <text x="617.5" y="400.6" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="normal" xml:space="preserve">LoadPlan</text>
</svg>
