<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="820" height="560" font-family="Helvetica, Arial, sans-serif">
  <title>The cargo loading system placed in the four rings of clean architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker>
    <marker id="hollow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#52606d" stroke-width="1.2"/></marker>
  </defs>
  <rect width="820" height="560" fill="#ffffff"/>
  <rect x="20" y="20" width="780" height="520" rx="12" fill="#eef2f6" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="34" y="40" text-anchor="start" font-size="14" fill="#1f2933" font-weight="bold">Frameworks and drivers</text>
  <rect x="50" y="90" width="720" height="420" rx="12" fill="#dbe7f1" stroke="#7b9bb8" stroke-width="1.5"/>
  <text x="64" y="110" text-anchor="start" font-size="14" fill="#1f2933" font-weight="bold">Interface adapters</text>
  <rect x="80" y="170" width="660" height="310" rx="12" fill="#bcd3e6" stroke="#4f82ad" stroke-width="1.5"/>
  <text x="94" y="190" text-anchor="start" font-size="14" fill="#1f2933" font-weight="bold">Use cases</text>
  <rect x="110" y="390" width="600" height="75" rx="12" fill="#ffffff" stroke="#2f6f9f" stroke-width="1.5"/>
  <text x="124" y="410" text-anchor="start" font-size="14" fill="#2f6f9f" font-weight="bold">Entities</text>
  <rect x="220" y="40" width="175" height="34" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="307.5" y="61.5" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="normal">File system</text>
  <rect x="410" y="40" width="175" height="34" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="497.5" y="61.5" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="normal">Web framework</text>
  <rect x="600" y="40" width="175" height="34" rx="6" fill="#fde2d0" stroke="#c2410c" stroke-width="1.5"/>
  <text x="687.5" y="61.5" text-anchor="middle" font-size="13" fill="#9a3412" font-weight="normal">Composition root (main)</text>
  <rect x="80" y="118" width="158" height="34" rx="6" fill="#ffffff" stroke="#2f6f9f" stroke-width="1.5"/>
  <text x="159.0" y="139.6" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="normal">CsvBookingReader</text>
  <rect x="252" y="118" width="158" height="34" rx="6" fill="#ffffff" stroke="#2f6f9f" stroke-width="1.5"/>
  <text x="331.0" y="139.6" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="normal">JsonBookingReader</text>
  <rect x="424" y="118" width="158" height="34" rx="6" fill="#ffffff" stroke="#2f6f9f" stroke-width="1.5"/>
  <text x="503.0" y="139.6" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="normal">CsvPlanWriter</text>
  <rect x="596" y="118" width="158" height="34" rx="6" fill="#ffffff" stroke="#2f6f9f" stroke-width="1.5"/>
  <text x="675.0" y="139.6" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="normal">WebController</text>
  <rect x="100" y="200" width="360" height="80" rx="6" fill="#ffffff" stroke="#2f6f9f" stroke-width="1.5"/>
  <text x="280" y="220" text-anchor="middle" font-size="14" fill="#1f2933" font-weight="bold">PlanFlightLoad(data)</text>
  <rect x="112" y="234" width="106" height="32" rx="6" fill="#dbe7f1" stroke="#2f6f9f" stroke-width="1.5"/>
  <text x="165.0" y="254.6" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="normal">preprocess</text>
  <rect x="227" y="234" width="106" height="32" rx="6" fill="#dbe7f1" stroke="#2f6f9f" stroke-width="1.5"/>
  <text x="280.0" y="254.6" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="normal">optimize</text>
  <line x1="218" y1="250" x2="226" y2="250" stroke="#52606d" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="342" y="234" width="106" height="32" rx="6" fill="#dbe7f1" stroke="#2f6f9f" stroke-width="1.5"/>
  <text x="395.0" y="254.6" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="normal">postprocess</text>
  <line x1="333" y1="250" x2="341" y2="250" stroke="#52606d" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="490" y="195" width="230" height="30" rx="6" fill="#ffffff" stroke="#2f6f9f" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="605.0" y="214.6" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="bold">«interface» SolutionProvider</text>
  <rect x="510" y="235" width="210" height="26" rx="6" fill="#ffffff" stroke="#2f6f9f" stroke-width="1.5"/>
  <text x="615.0" y="252.2" text-anchor="middle" font-size="12" fill="#1f2933" font-weight="normal">EnumerationProvider</text>
  <rect x="510" y="267" width="210" height="26" rx="6" fill="#ffffff" stroke="#2f6f9f" stroke-width="1.5"/>
  <text x="615.0" y="284.2" text-anchor="middle" font-size="12" fill="#1f2933" font-weight="normal">GreedyHeuristicProvider</text>
  <rect x="510" y="299" width="210" height="26" rx="6" fill="#ffffff" stroke="#2f6f9f" stroke-width="1.5"/>
  <text x="615.0" y="316.2" text-anchor="middle" font-size="12" fill="#1f2933" font-weight="normal">MipProviderHighs</text>
  <line x1="300" y1="234" x2="486" y2="212" stroke="#52606d" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="100" y="320" text-anchor="start" font-size="13" fill="#52606d" font-weight="normal">The use case receives entities and returns a LoadPlan.</text>
  <text x="100" y="340" text-anchor="start" font-size="13" fill="#52606d" font-weight="normal">Every read and write happens in the adapters.</text>
  <rect x="135" y="420" width="125" height="32" rx="6" fill="#dbe7f1" stroke="#2f6f9f" stroke-width="1.5"/>
  <text x="197.5" y="440.6" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="normal">Product</text>
  <rect x="275" y="420" width="125" height="32" rx="6" fill="#dbe7f1" stroke="#2f6f9f" stroke-width="1.5"/>
  <text x="337.5" y="440.6" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="normal">BookingList</text>
  <rect x="415" y="420" width="125" height="32" rx="6" fill="#dbe7f1" stroke="#2f6f9f" stroke-width="1.5"/>
  <text x="477.5" y="440.6" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="normal">Aircraft</text>
  <rect x="555" y="420" width="125" height="32" rx="6" fill="#dbe7f1" stroke="#2f6f9f" stroke-width="1.5"/>
  <text x="617.5" y="440.6" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="normal">LoadPlan</text>
</svg>
