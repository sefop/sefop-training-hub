<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520" font-family="Helvetica, Arial, sans-serif">
  <title>Figure: cargo architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker>
    <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#52606d" stroke-width="1.4"/></marker>
    <marker id="hollow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#52606d" stroke-width="1.2"/></marker>
  </defs>
  <rect width="820" height="520" fill="#ffffff"/>
  <rect x="20" y="20" width="780" height="480" rx="12" fill="#d6e6f5" stroke="#2f6f9f" stroke-width="2"/>
  <text x="34" y="40" text-anchor="start" font-size="14" fill="#2f6f9f" font-weight="bold" xml:space="preserve">Frameworks and drivers</text>
  <rect x="50" y="90" width="720" height="380" rx="12" fill="#d9f0e1" stroke="#2f855a" stroke-width="2"/>
  <text x="64" y="110" text-anchor="start" font-size="14" fill="#2f855a" font-weight="bold" xml:space="preserve">Interface adapters</text>
  <rect x="80" y="170" width="660" height="270" rx="12" fill="#fcefc7" stroke="#b7791f" stroke-width="2"/>
  <text x="94" y="190" text-anchor="start" font-size="14" fill="#b7791f" font-weight="bold" xml:space="preserve">Use cases</text>
  <rect x="110" y="350" width="600" height="75" rx="12" fill="#e6defa" stroke="#6b46c1" stroke-width="2"/>
  <text x="124" y="370" text-anchor="start" font-size="14" fill="#6b46c1" font-weight="bold" xml:space="preserve">Entities</text>
  <rect x="220" y="40" width="175" height="34" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="307.5" y="61.5" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="normal" xml:space="preserve">File system</text>
  <rect x="410" y="40" width="175" height="34" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="497.5" y="61.5" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="normal" xml:space="preserve">Web framework</text>
  <rect x="600" y="40" width="175" height="34" rx="6" fill="#fde2d0" stroke="#c2410c" stroke-width="1.5"/>
  <text x="687.5" y="61.5" text-anchor="middle" font-size="13" fill="#9a3412" font-weight="normal" xml:space="preserve">Composition root</text>
  <rect x="80" y="118" width="158" height="34" rx="6" fill="#ffffff" stroke="#2f855a" stroke-width="1.5"/>
  <text x="159.0" y="139.6" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="normal" xml:space="preserve">CsvBookingReader</text>
  <rect x="252" y="118" width="158" height="34" rx="6" fill="#ffffff" stroke="#2f855a" stroke-width="1.5"/>
  <text x="331.0" y="139.6" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="normal" xml:space="preserve">JsonBookingReader</text>
  <rect x="424" y="118" width="158" height="34" rx="6" fill="#ffffff" stroke="#2f855a" stroke-width="1.5"/>
  <text x="503.0" y="139.6" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="normal" xml:space="preserve">CsvPlanWriter</text>
