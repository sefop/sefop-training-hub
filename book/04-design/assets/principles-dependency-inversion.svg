<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" font-family="Helvetica, Arial, sans-serif">
  <title>Dependency inversion: the optimize step depends on an interface that the MIP provider implements</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker>
    <marker id="hollow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#52606d" stroke-width="1.2"/></marker>
  </defs>
  <rect width="800" height="380" fill="#ffffff"/>
  <line x1="330" y1="20" x2="330" y2="360" stroke="#e4e7eb" stroke-width="2"/>
  <text x="165" y="36" text-anchor="middle" font-size="17" fill="#1f2933" font-weight="bold">Before</text>
  <text x="565" y="36" text-anchor="middle" font-size="17" fill="#1f2933" font-weight="bold">After</text>
  <rect x="70" y="70" width="190" height="50" rx="6" fill="#dbe7f1" stroke="#2f6f9f" stroke-width="1.5"/>
  <text x="165.0" y="99.9" text-anchor="middle" font-size="14" fill="#1f2933" font-weight="normal">Optimize step</text>
  <rect x="70" y="250" width="190" height="50" rx="6" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="165.0" y="279.9" text-anchor="middle" font-size="14" fill="#1f2933" font-weight="normal">HiGHS library</text>
  <line x1="165" y1="122" x2="165" y2="246" stroke="#52606d" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="175" y="190" text-anchor="start" font-size="13" fill="#52606d" font-weight="normal">depends on</text>
  <rect x="470" y="70" width="190" height="50" rx="6" fill="#dbe7f1" stroke="#2f6f9f" stroke-width="1.5"/>
  <text x="565.0" y="99.9" text-anchor="middle" font-size="14" fill="#1f2933" font-weight="normal">Optimize step</text>
  <rect x="450" y="160" width="230" height="56" rx="6" fill="#ffffff" stroke="#2f6f9f" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="565.0" y="184.4" text-anchor="middle" font-size="14" fill="#1f2933" font-weight="bold">«interface»</text>
  <text x="565.0" y="201.4" text-anchor="middle" font-size="14" fill="#1f2933" font-weight="bold">SolutionProvider</text>
  <rect x="470" y="250" width="190" height="44" rx="6" fill="#dbe7f1" stroke="#2f6f9f" stroke-width="1.5"/>
  <text x="565.0" y="276.9" text-anchor="middle" font-size="14" fill="#1f2933" font-weight="normal">MipProviderHighs</text>
  <rect x="470" y="318" width="190" height="36" rx="6" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="565.0" y="340.6" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="normal">HiGHS library</text>
  <line x1="565" y1="122" x2="565" y2="156" stroke="#52606d" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="575" y="143" text-anchor="start" font-size="13" fill="#52606d" font-weight="normal">depends on</text>
  <line x1="565" y1="248" x2="565" y2="220" stroke="#52606d" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#hollow)"/>
  <text x="575" y="239" text-anchor="start" font-size="13" fill="#52606d" font-weight="normal">implements</text>
  <line x1="565" y1="296" x2="565" y2="314" stroke="#52606d" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="690" y="190" text-anchor="start" font-size="12" fill="#52606d" font-weight="normal">owned by</text>
  <text x="690" y="206" text-anchor="start" font-size="12" fill="#52606d" font-weight="normal">the optimize step</text>
</svg>
