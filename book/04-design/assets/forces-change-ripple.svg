<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 426" width="900" height="426" font-family="Helvetica, Arial, sans-serif">
  <title>Figure: change ripple</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker>
    <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#52606d" stroke-width="1.4"/></marker>
    <marker id="hollow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#52606d" stroke-width="1.2"/></marker>
  </defs>
  <rect width="900" height="426" fill="#ffffff"/>
  <text x="20" y="34" text-anchor="start" font-size="16" fill="#1f2933" font-weight="bold" xml:space="preserve">Change: write the plan as JSON instead of CSV</text>
  <text x="20" y="66" text-anchor="start" font-size="13" fill="#52606d" font-weight="bold" xml:space="preserve">Listing: tangled script</text>
  <line x1="630" y1="20" x2="630" y2="406" stroke="#e4e7eb" stroke-width="2"/>
  <text x="765" y="66" text-anchor="middle" font-size="13" fill="#52606d" font-weight="bold" xml:space="preserve">The same steps as separate parts</text>
  <text x="34" y="100" text-anchor="start" font-size="12" fill="#52606d" font-weight="normal" font-family="Consolas, Menlo, monospace" xml:space="preserve">// listing: tangled-script</text>
  <text x="34" y="122" text-anchor="start" font-size="12" fill="#1f2933" font-weight="normal" font-family="Consolas, Menlo, monospace" xml:space="preserve">public function plan_flight_load(booking_file, aircraft_file, plan_file):</text>
  <text x="34" y="144" text-anchor="start" font-size="12" fill="#1f2933" font-weight="normal" font-family="Consolas, Menlo, monospace" xml:space="preserve">    products = read each row of booking_file as a product</text>
  <text x="34" y="166" text-anchor="start" font-size="12" fill="#1f2933" font-weight="normal" font-family="Consolas, Menlo, monospace" xml:space="preserve">    capacity = read weight and volume limits from aircraft_file</text>
  <text x="34" y="188" text-anchor="start" font-size="12" fill="#1f2933" font-weight="normal" font-family="Consolas, Menlo, monospace" xml:space="preserve">    if committed freight exceeds capacity:</text>
  <rect x="20" y="195" width="590" height="22" fill="#fde2d0"/>
  <rect x="20" y="195" width="5" height="22" fill="#c2410c"/>
  <text x="34" y="210" text-anchor="start" font-size="12" fill="#1f2933" font-weight="normal" font-family="Consolas, Menlo, monospace" xml:space="preserve">        write &quot;INFEASIBLE&quot; to plan_file</text>
  <text x="34" y="232" text-anchor="start" font-size="12" fill="#1f2933" font-weight="normal" font-family="Consolas, Menlo, monospace" xml:space="preserve">        stop</text>
  <text x="34" y="254" text-anchor="start" font-size="12" fill="#1f2933" font-weight="normal" font-family="Consolas, Menlo, monospace" xml:space="preserve">    remove products whose single pallet cannot fit in the aircraft</text>
  <text x="34" y="276" text-anchor="start" font-size="12" fill="#1f2933" font-weight="normal" font-family="Consolas, Menlo, monospace" xml:space="preserve">    model = create a model with the solver library</text>
  <text x="34" y="298" text-anchor="start" font-size="12" fill="#1f2933" font-weight="normal" font-family="Consolas, Menlo, monospace" xml:space="preserve">    add variables, constraints and objective to model</text>
  <text x="34" y="320" text-anchor="start" font-size="12" fill="#1f2933" font-weight="normal" font-family="Consolas, Menlo, monospace" xml:space="preserve">    solve model with a 60-second time limit</text>
  <text x="34" y="342" text-anchor="start" font-size="12" fill="#1f2933" font-weight="normal" font-family="Consolas, Menlo, monospace" xml:space="preserve">    pallets = for each product, ask model for the value of its variable</text>
  <rect x="20" y="349" width="590" height="22" fill="#fde2d0"/>
  <rect x="20" y="349" width="5" height="22" fill="#c2410c"/>
  <text x="34" y="364" text-anchor="start" font-size="12" fill="#1f2933" font-weight="normal" font-family="Consolas, Menlo, monospace" xml:space="preserve">    write pallets and revenue as CSV to plan_file</text>
  <text x="20" y="410" text-anchor="start" font-size="14" fill="#9a3412" font-weight="normal" xml:space="preserve">2 lines, far apart, must change together</text>
  <rect x="675" y="90" width="180" height="36" rx="6" fill="#dbe7f1" stroke="#2f6f9f" stroke-width="1.5"/>
  <text x="765.0" y="112.9" text-anchor="middle" font-size="14" fill="#1f2933" font-weight="normal" xml:space="preserve">Input</text>
  <rect x="675" y="140" width="180" height="36" rx="6" fill="#dbe7f1" stroke="#2f6f9f" stroke-width="1.5"/>
  <text x="765.0" y="162.9" text-anchor="middle" font-size="14" fill="#1f2933" font-weight="normal" xml:space="preserve">Rules</text>
  <line x1="765" y1="127" x2="765" y2="138" stroke="#52606d" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="675" y="190" width="180" height="36" rx="6" fill="#dbe7f1" stroke="#2f6f9f" stroke-width="1.5"/>
  <text x="765.0" y="212.9" text-anchor="middle" font-size="14" fill="#1f2933" font-weight="normal" xml:space="preserve">Preprocess</text>
  <line x1="765" y1="177" x2="765" y2="188" stroke="#52606d" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="675" y="240" width="180" height="36" rx="6" fill="#dbe7f1" stroke="#2f6f9f" stroke-width="1.5"/>
  <text x="765.0" y="262.9" text-anchor="middle" font-size="14" fill="#1f2933" font-weight="normal" xml:space="preserve">Optimize</text>
  <line x1="765" y1="227" x2="765" y2="238" stroke="#52606d" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="675" y="290" width="180" height="36" rx="6" fill="#fde2d0" stroke="#c2410c" stroke-width="2"/>
  <text x="765.0" y="312.9" text-anchor="middle" font-size="14" fill="#9a3412" font-weight="bold" xml:space="preserve">Output</text>
  <line x1="765" y1="277" x2="765" y2="288" stroke="#52606d" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="765" y="410" text-anchor="middle" font-size="14" fill="#9a3412" font-weight="normal" xml:space="preserve">one part changes</text>
</svg>
