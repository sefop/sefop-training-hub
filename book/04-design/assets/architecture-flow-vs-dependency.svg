<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" font-family="Helvetica, Arial, sans-serif">
  <title>Figure: calls and dependencies</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker>
    <marker id="arrow-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
    <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#52606d" stroke-width="1.4"/></marker>
    <marker id="hollow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#52606d" stroke-width="1.2"/></marker>
  </defs>
  <rect width="860" height="420" fill="#ffffff"/>
  <line x1="410" y1="20" x2="410" y2="400" stroke="#e4e7eb" stroke-width="2"/>
  <text x="205" y="36" text-anchor="middle" font-size="16" fill="#1f2933" font-weight="bold" xml:space="preserve">At run time: who calls whom</text>
  <text x="635" y="36" text-anchor="middle" font-size="16" fill="#1f2933" font-weight="bold" xml:space="preserve">In the source code: who mentions whom</text>
  <rect x="95" y="70" width="220" height="46" rx="4" fill="#ffffff" stroke="#2f6f9f" stroke-width="1.5"/>
  <text x="205.0" y="98.04" text-anchor="middle" font-size="14" fill="#1f2933" font-weight="bold" xml:space="preserve">Optimization</text>
  <rect x="95" y="190" width="220" height="46" rx="4" fill="#ffffff" stroke="#2f6f9f" stroke-width="1.5"/>
  <text x="205.0" y="218.04" text-anchor="middle" font-size="14" fill="#1f2933" font-weight="bold" xml:space="preserve">MipProviderGurobi</text>
  <rect x="105" y="310" width="200" height="40" rx="6" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="205.0" y="335.04" text-anchor="middle" font-size="14" fill="#1f2933" font-weight="normal" xml:space="preserve">Gurobi library</text>
  <line x1="205" y1="116" x2="205" y2="188" stroke="#52606d" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="215" y="157" text-anchor="start" font-size="13" fill="#52606d" font-weight="normal" xml:space="preserve">calls</text>
  <line x1="205" y1="236" x2="205" y2="308" stroke="#52606d" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="215" y="278" text-anchor="start" font-size="13" fill="#52606d" font-weight="normal" xml:space="preserve">calls</text>
  <text x="205" y="385" text-anchor="middle" font-size="13" fill="#52606d" font-weight="normal" font-style="italic" xml:space="preserve">the calls go outward</text>
  <rect x="440" y="78" width="150" height="46" rx="4" fill="#ffffff" stroke="#2f6f9f" stroke-width="1.5"/>
  <text x="515.0" y="106.04" text-anchor="middle" font-size="14" fill="#1f2933" font-weight="bold" xml:space="preserve">Optimization</text>
  <rect x="635" y="65" width="190" height="54" rx="4" fill="#ffffff" stroke="#2f6f9f" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="730.0" y="82" text-anchor="middle" font-size="12" fill="#52606d" font-weight="normal" xml:space="preserve">«interface»</text>
  <text x="730.0" y="100" text-anchor="middle" font-size="14" fill="#1f2933" font-weight="bold" xml:space="preserve">SolutionProvider</text>
  <line x1="635" y1="109" x2="825" y2="109" stroke="#2f6f9f" stroke-width="1"/>
  <line x1="592" y1="101" x2="633" y2="101" stroke="#52606d" stroke-width="1.6" marker-end="url(#open)"/>
  <text x="612" y="93" text-anchor="middle" font-size="12" fill="#52606d" font-weight="normal" xml:space="preserve">uses</text>
  <rect x="620" y="190" width="220" height="46" rx="4" fill="#ffffff" stroke="#2f6f9f" stroke-width="1.5"/>
  <text x="730.0" y="218.04" text-anchor="middle" font-size="14" fill="#1f2933" font-weight="bold" xml:space="preserve">MipProviderGurobi</text>
  <line x1="730" y1="190" x2="730" y2="121" stroke="#52606d" stroke-width="1.6" marker-end="url(#hollow)"/>
  <text x="720" y="162" text-anchor="end" font-size="13" fill="#52606d" font-weight="normal" xml:space="preserve">implements</text>
  <rect x="630" y="310" width="200" height="40" rx="6" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.5"/>
  <text x="730.0" y="335.04" text-anchor="middle" font-size="14" fill="#1f2933" font-weight="normal" xml:space="preserve">Gurobi library</text>
  <line x1="730" y1="236" x2="730" y2="308" stroke="#52606d" stroke-width="1.6" marker-end="url(#open)"/>
  <text x="720" y="278" text-anchor="end" font-size="13" fill="#52606d" font-weight="normal" xml:space="preserve">uses</text>
  <text x="432" y="150" text-anchor="start" font-size="12" fill="#52606d" font-weight="normal" font-style="italic" xml:space="preserve">Optimization owns the interface</text>
  <text x="432" y="166" text-anchor="start" font-size="12" fill="#52606d" font-weight="normal" font-style="italic" xml:space="preserve">and never mentions the provider</text>
  <text x="630" y="385" text-anchor="middle" font-size="13" fill="#52606d" font-weight="normal" font-style="italic" xml:space="preserve">the provider's dependency points inward</text>
</svg>
