  <line x1="442" y1="68" x2="508" y2="68" stroke="#52606d" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="630" y="63" text-anchor="start" font-size="12" fill="#52606d" font-weight="normal" font-family="Consolas, Menlo, monospace" xml:space="preserve">optimal, feasible,</text>
  <text x="630" y="81" text-anchor="start" font-size="12" fill="#52606d" font-weight="normal" font-family="Consolas, Menlo, monospace" xml:space="preserve">infeasible or not_found</text>
