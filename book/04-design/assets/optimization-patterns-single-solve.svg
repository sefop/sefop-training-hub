  <line x1="442" y1="178" x2="508" y2="178" stroke="#52606d" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="630" y="173" text-anchor="start" font-size="12" fill="#52606d" font-weight="normal" font-family="Consolas, Menlo, monospace" xml:space="preserve">feasible or not_found;</text>
