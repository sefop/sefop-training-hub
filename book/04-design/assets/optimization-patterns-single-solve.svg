  <rect x="210" y="40" width="230" height="56" rx="6" fill="#d6e6f5" stroke="#2f6f9f" stroke-width="1.5"/>
  <text x="325.0" y="65.0" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="bold" xml:space="preserve">MipProviderGurobi</text>
  <text x="325.0" y="82.0" text-anchor="middle" font-size="12" fill="#52606d" font-weight="normal" xml:space="preserve">exact provider</text>
  <rect x="510" y="51" width="100" height="34" rx="17" fill="#d9f0e1" stroke="#2f855a" stroke-width="1.5"/>
  <text x="560.0" y="72.68" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="normal" xml:space="preserve">Result</text>
