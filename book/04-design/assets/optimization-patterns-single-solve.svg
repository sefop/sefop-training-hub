  <text x="85.0" y="182.68" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="normal" xml:space="preserve">Instance</text>
  <rect x="210" y="150" width="230" height="56" rx="6" fill="#fde2d0" stroke="#c2410c" stroke-width="1.5"/>
  <text x="325.0" y="175.0" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="bold" xml:space="preserve">LocalSearchProvider</text>
  <text x="325.0" y="192.0" text-anchor="middle" font-size="12" fill="#52606d" font-weight="normal" xml:space="preserve">heuristic provider</text>
