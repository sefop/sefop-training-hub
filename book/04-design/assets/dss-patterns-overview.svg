  <text x="52" y="432" text-anchor="start" font-size="12" fill="#52606d" font-weight="normal" xml:space="preserve">exact provider</text>
  <rect x="155" y="421" width="16" height="14" rx="3" fill="#fde2d0" stroke="#c2410c" stroke-width="1.2"/>
  <text x="177" y="432" text-anchor="start" font-size="12" fill="#52606d" font-weight="normal" xml:space="preserve">heuristic provider</text>
  <rect x="300" y="421" width="16" height="14" rx="3" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
  <text x="322" y="432" text-anchor="start" font-size="12" fill="#52606d" font-weight="normal" xml:space="preserve">either kind</text>
