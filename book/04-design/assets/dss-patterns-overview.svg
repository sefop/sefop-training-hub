  <rect x="640" y="258" width="110" height="34" rx="6" fill="#d6e6f5" stroke="#2f6f9f" stroke-width="1.5"/>
  <text x="695.0" y="279.68" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="bold" xml:space="preserve">exact</text>
  <rect x="640" y="304" width="110" height="34" rx="6" fill="#fde2d0" stroke="#c2410c" stroke-width="1.5"/>
  <text x="695.0" y="325.68" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="bold" xml:space="preserve">heuristic</text>
  <line x1="448" y1="297" x2="463" y2="297" stroke="#52606d" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="530" y1="289" x2="638" y2="275" stroke="#52606d" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="530" y1="305" x2="638" y2="321" stroke="#52606d" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M750,275 H790 V297 H832" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M750,321 H790 V297" fill="none" stroke="#52606d" stroke-width="1.6"/>
