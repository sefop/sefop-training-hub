  <text x="456" y="246" text-anchor="start" font-size="15" fill="#1f2933" font-weight="bold" xml:space="preserve">Selected solve</text>
  <text x="640" y="384" text-anchor="middle" font-size="12" fill="#52606d" font-weight="normal" font-style="italic" xml:space="preserve">one provider for each instance</text>
