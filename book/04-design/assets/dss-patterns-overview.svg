  <line x1="190" y1="297" x2="258" y2="297" stroke="#52606d" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="224" y="289" text-anchor="middle" font-size="12" fill="#52606d" font-weight="normal" xml:space="preserve">seed</text>
