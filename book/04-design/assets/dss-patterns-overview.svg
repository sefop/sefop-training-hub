  <text x="220" y="184" text-anchor="middle" font-size="12" fill="#52606d" font-weight="normal" font-style="italic" xml:space="preserve">one provider</text>
  <rect x="440" y="20" width="400" height="180" rx="10" fill="#ffffff" stroke="#e4e7eb" stroke-width="2"/>
  <text x="456" y="46" text-anchor="start" font-size="15" fill="#1f2933" font-weight="bold" xml:space="preserve">Staged solve</text>
  <text x="640" y="184" text-anchor="middle" font-size="12" fill="#52606d" font-weight="normal" font-style="italic" xml:space="preserve">different problems, one after another</text>
  <rect x="20" y="220" width="400" height="180" rx="10" fill="#ffffff" stroke="#e4e7eb" stroke-width="2"/>
