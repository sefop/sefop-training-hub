name: Book checks

# Markdown structure and style, checked on every push and pull request so that
# formatting mistakes are caught by a machine instead of by a reader.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The internal link and anchor check is deliberately not here: it runs locally,
      # from a pre-commit hook, because the script lives outside this repository.

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Check only — never --fix here. CI that rewrites your branch turns a green
      # build into commits nobody wrote. Run `npx markdownlint-cli2 --fix` locally.
      - name: Lint markdown
        run: npx --yes markdownlint-cli2@0.13.0
